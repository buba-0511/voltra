name: energy-platform

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy-platform-backend
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      DATABASE_DSN: postgres://app:app@db:5432/energy?sslmode=disable
      DATA_DIR: /data
      ALLOWED_ORIGIN: http://localhost:5173
      # Local dev only - production sets its own via the real secrets
      # manager. The server refuses to start without one (see
      # internal/config), so it can never silently run with a
      # source-committed default.
      JWT_SECRET: local-dev-only-secret-do-not-use-in-production
      # Optional - copy .env.example to .env and set a real key to get
      # LLM-written explanations. Without it, every anomaly still gets a
      # real explanation, just from the deterministic template fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: go run ./cmd/server

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy-platform-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

  db:
    image: postgres:16-alpine
    container_name: energy-platform-db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: energy
    ports:
      - '5433:5432'
    volumes:
      - energy_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d energy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  energy_platform_pgdata:
